[package]
name = "wlt"
version = "0.1.0"
description = "WLT - lightweight SSH / local terminal for Windows"
authors = ["JohnnyStudio"]
edition = "2021"

[lib]
name = "wlt_lib"
# Desktop only: "cdylib" (needed for mobile) overflows the PE export table on windows-gnu.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "macros", "rt-multi-thread", "fs", "io-util", "net"] }
portable-pty = "0.9"
russh = { version = "0.65", default-features = false, features = ["ring", "rsa", "flate2"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
russh-sftp = "3"
tauri-plugin-dialog = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
